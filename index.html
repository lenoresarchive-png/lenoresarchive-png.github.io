<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lenore's Archive | Literature, Reviews & Reading</title>

    <meta name="description"
          content="Lenore's Archive — a literary space for book reviews, recommendations, quizzes and thoughtful explorations of literature.">

    <!-- =========================
         GOOGLE FONTS
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&family=Montserrat:wght@400;500;600&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f4eee3;
            color: #28231f;
            font-family: "Cormorant Garamond", Georgia, serif;
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================
           NAVIGATION
        ========================== */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;

            padding: 16px 5%;

            background: rgba(244, 238, 227, 0.96);

            border-bottom: 1px solid #c8bcae;

            box-shadow: 0 3px 15px rgba(50, 40, 30, 0.08);
        }

        nav a {
            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.75rem;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            padding: 9px 15px;

            border: 1px solid transparent;

            transition: all 0.25s ease;
        }

        nav a:hover {
            border-color: #51433a;

            background: #302822;

            color: #f4eee3;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            position: relative;

            width: 100%;

            height: 570px;

            background:
                linear-gradient(
                    rgba(20, 15, 12, 0.18),
                    rgba(20, 15, 12, 0.42)
                ),
                url("images/Hogwarts%20background.jpg");

            background-size: cover;

            background-position: center;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            box-shadow:
                inset 0 -80px 100px rgba(20, 15, 12, 0.35);
        }


        /* =========================
           HERO TITLE
        ========================== */

        .hero-title {
            position: absolute;

            top: 35%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 90%;

            text-align: center;

            color: #fffaf0;

            text-shadow:
                0 3px 15px rgba(0,0,0,0.65),
                0 1px 3px rgba(0,0,0,0.7);
        }

        .hero-title h1 {
            font-family: "Parisienne", cursive;

            font-size: clamp(4rem, 10vw, 8rem);

            font-weight: normal;

            line-height: 1.1;
        }

        .hero-title p {
            margin-top: 12px;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.8rem;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        /* =========================
           PROFILE PHOTO
        ========================== */

        .profile-container {
            position: absolute;

            bottom: -92px;

            width: 185px;

            height: 185px;

            border-radius: 50%;

            padding: 7px;

            background: #f4eee3;

            box-shadow:
                0 7px 30px rgba(0,0,0,0.30),
                0 0 0 2px #806f61;
        }

        .profile-photo {
            width: 100%;

            height: 100%;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border: 4px solid #f4eee3;
        }


        /* =========================
           INTRODUCTION
        ========================== */

        .intro {
            text-align: center;

            max-width: 850px;

            margin: 140px auto 85px;

            padding: 0 25px;
        }

        .intro .subtitle {
            margin-top: 12px;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.78rem;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .intro-text {
            margin-top: 30px;

            font-size: 1.3rem;

            color: #51473f;
        }


        /* =========================
           SECTION STRUCTURE
        ========================== */

        section {
            max-width: 1150px;

            margin: 0 auto;

            padding: 75px 7%;
        }

        .section-heading {
            text-align: center;

            margin-bottom: 45px;
        }

        .section-heading h2 {
            font-family: "Parisienne", cursive;

            font-size: clamp(2.8rem, 5vw, 4.2rem);

            font-weight: normal;

            line-height: 1.2;
        }

        .section-heading p {
            margin-top: 10px;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.72rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #74675d;
        }


        /* =========================
           IMAGE BANNER
        ========================== */

        .image-banner {
            position: relative;

            min-height: 360px;

            margin: 25px auto 60px;

            max-width: 1050px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            background-image:
                linear-gradient(
                    rgba(35, 20, 15, 0.38),
                    rgba(35, 20, 15, 0.48)
                ),
                url("images/Stack%20of%20books.jpg");

            background-size: cover;

            background-position: center;

            border: 1px solid #a89583;

            box-shadow:
                0 12px 35px rgba(55,45,37,0.16);
        }

        .image-banner-content {
            position: relative;

            z-index: 2;

            max-width: 700px;

            padding: 40px;

            color: #fffaf0;

            text-shadow: 0 2px 8px rgba(0,0,0,0.55);
        }

        .image-banner-content h2 {
            font-family: "Parisienne", cursive;

            font-size: clamp(3rem, 6vw, 5rem);

            font-weight: normal;
        }

        .image-banner-content p {
            margin-top: 15px;

            font-size: 1.25rem;
        }


        /* =========================
           MOTIVATION / RED EMBROIDERY
        ========================== */

        .motivation {
            position: relative;

            max-width: 900px;

            text-align: center;

            overflow: hidden;

            border: 1px solid #7b332e;

            color: #fff8ed;

            background:
                linear-gradient(
                    rgba(70, 20, 18, 0.72),
                    rgba(70, 20, 18, 0.72)
                ),
                url("images/Red%20embroidery%20background.jpg");

            background-size: cover;

            background-position: center;

            box-shadow:
                0 12px 35px rgba(80,30,25,0.18);
        }

        .motivation .section-heading h2 {
            color: #fff8ed;
        }

        .motivation .section-heading p {
            color: #e8d1c8;
        }

        .motivation p {
            font-size: 1.25rem;

            color: #fff5ea;
        }


        /* =========================
           IMAGE STRIP
        ========================== */

        .image-strip {
            max-width: 1100px;

            margin: 30px auto;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            padding: 0 7%;
        }

        .image-tile {
            height: 260px;

            border: 1px solid #bcae9f;

            background-size: cover;

            background-position: center;

            box-shadow:
                0 8px 25px rgba(50,40,30,0.12);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .image-tile:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 30px rgba(50,40,30,0.18);
        }

        .tile-books {
            background-image:
                linear-gradient(
                    rgba(20,15,10,0.08),
                    rgba(20,15,10,0.08)
                ),
                url("images/Stack%20of%20books.jpg");
        }

        .tile-cat {
            background-image:
                linear-gradient(
                    rgba(20,15,10,0.08),
                    rgba(20,15,10,0.08)
                ),
                url("images/Fire%20place%20cat.jpg");
        }

        .tile-cathedral {
            background-image:
                linear-gradient(
                    rgba(20,15,10,0.08),
                    rgba(20,15,10,0.08)
                ),
                url("images/Sunlight%20cathedral.jpg");
        }


        /* =========================
           ARTICLE CARDS
        ========================== */

        .cards {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 30px;
        }

        .card {
            position: relative;

            background: #f9f5ed;

            border: 1px solid #cfc3b5;

            padding: 32px;

            overflow: hidden;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);

            box-shadow:
                0 15px 35px rgba(55,45,37,0.13);
        }

        .card-label {
            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.65rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: #806f61;
        }

        .card h3 {
            font-family: "Cormorant Garamond", Georgia, serif;

            font-size: 1.9rem;

            font-weight: 600;

            margin: 12px 0;
        }

        .card p {
            font-size: 1.08rem;

            color: #5a5048;

            margin-bottom: 20px;
        }

        .card-button {
            display: inline-block;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.68rem;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            border-bottom: 1px solid #51433a;

            padding-bottom: 3px;

            transition: 0.2s ease;
        }

        .card-button:hover {
            letter-spacing: 2px;
        }


        /* =========================
           REVIEW SECTION DECORATION
        ========================== */

        .review-section {
            position: relative;
        }

        .review-section::before {
            content: "❦";

            display: block;

            text-align: center;

            font-size: 2rem;

            color: #806f61;

            margin-bottom: 15px;
        }


        /* =========================
           REVIEW EXCERPT
        ========================== */

        .excerpt {
            max-width: 850px;

            margin: auto;

            padding: 55px;

            border-left: 4px solid #7b332e;

            background:
                linear-gradient(
                    rgba(75, 27, 24, 0.73),
                    rgba(75, 27, 24, 0.73)
                ),
                url("images/Red%20embroidery%20background.jpg");

            background-size: cover;

            background-position: center;

            box-shadow:
                0 10px 30px rgba(70,30,25,0.15);
        }

        .excerpt p {
            font-size: 1.4rem;

            font-style: italic;

            color: #fff7ed;

            text-align: center;
        }


        /* =========================
           SECOND IMAGE FEATURE
        ========================== */

        .feature-image {
            position: relative;

            min-height: 330px;

            max-width: 950px;

            margin: 30px auto;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(30,20,15,0.30),
                    rgba(30,20,15,0.45)
                ),
                url("images/White%20lilies.jpg");

            background-size: cover;

            background-position: center;

            border: 1px solid #b9aa9b;
        }

        .feature-image-content {
            padding: 40px;

            color: white;

            text-shadow:
                0 2px 10px rgba(0,0,0,0.6);
        }

        .feature-image-content h2 {
            font-family: "Parisienne", cursive;

            font-size: 4rem;

            font-weight: normal;
        }

        .feature-image-content p {
            margin-top: 8px;

            font-size: 1.15rem;
        }


        /* =========================
           QUIZ SECTION
        ========================== */

        .quiz-section {
            position: relative;

            max-width: 900px;

            text-align: center;

            overflow: hidden;

            color: #f8f2e8;

            background:
                linear-gradient(
                    rgba(25, 47, 64, 0.80),
                    rgba(25, 47, 64, 0.80)
                ),
                url("images/Hands%20joining.jpg");

            background-size: cover;

            background-position: center;

            border: 1px solid #314b5c;

            box-shadow:
                0 12px 35px rgba(25,45,60,0.18);
        }

        .quiz-section .section-heading h2 {
            color: #fffaf1;
        }

        .quiz-section .section-heading p {
            color: #d4dfe4;
        }

        .quiz-section > p {
            font-size: 1.2rem;

            color: #f4f0e9;
        }


        /* =========================
           BUTTON
        ========================== */

        .contact-button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 27px;

            background: #302822;

            color: #f4eee3;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.7rem;

            letter-spacing: 2px;

            text-transform: uppercase;

            border: 1px solid #302822;

            transition: 0.25s ease;
        }

        .contact-button:hover {
            background: #57483d;

            transform: translateY(-2px);
        }


        /* =========================
           AUTHOR SECTION
        ========================== */

        .author-section {
            text-align: center;

            border-top: 1px solid #c8bcae;
        }

        .author-section p {
            max-width: 680px;

            margin: 20px auto;

            font-size: 1.18rem;

            color: #51473f;
        }


        /* =========================
           AUTHOR IMAGE FEATURE
        ========================== */

        .author-image {
            width: 180px;

            height: 180px;

            margin: 0 auto 30px;

            border-radius: 50%;

            background:
                linear-gradient(
                    rgba(30,20,15,0.20),
                    rgba(30,20,15,0.20)
                ),
                url("images/Star%20catching.jpg");

            background-size: cover;

            background-position: center;

            border: 6px solid #f4eee3;

            box-shadow:
                0 0 0 1px #9c8c7b,
                0 8px 25px rgba(50,40,30,0.16);
        }


        /* =========================
           CONTACT SECTION
        ========================== */

        .contact-section {
            position: relative;

            text-align: center;

            max-width: 1000px;

            overflow: hidden;

            color: #fff7ed;

            background:
                linear-gradient(
                    rgba(50, 24, 20, 0.76),
                    rgba(50, 24, 20, 0.76)
                ),
                url("images/Carpet%20background.jpg");

            background-size: cover;

            background-position: center;

            border: 1px solid #8d6257;

            box-shadow:
                0 12px 35px rgba(60,30,25,0.15);
        }

        .contact-section .section-heading h2 {
            color: #fff7ed;
        }

        .contact-section .section-heading p {
            color: #ead4ca;
        }

        .contact-section p {
            max-width: 650px;

            margin: 20px auto;

            font-size: 1.18rem;

            color: #fff3e9;
        }

        .contact-section .contact-button {
            background: #f4eee3;

            color: #302822;

            border-color: #f4eee3;
        }

        .contact-section .contact-button:hover {
            background: #fffaf2;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            margin-top: 30px;

            padding: 50px 7%;

            text-align: center;

            border-top: 1px solid #c8bcae;

            color: #75685d;
        }

        footer .footer-title {
            font-family: "Parisienne", cursive;

            font-size: 2.5rem;

            color: #382e28;
        }

        footer p {
            margin-top: 8px;

            font-family: "Montserrat", Arial, sans-serif;

            font-size: 0.65rem;

            letter-spacing: 1px;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            nav {
                padding: 10px 3%;

                gap: 3px;
            }

            nav a {
                font-size: 0.6rem;

                padding: 7px 8px;

                letter-spacing: 1px;
            }

            .hero {
                height: 430px;
            }

            .hero-title {
                top: 33%;
            }

            .hero-title h1 {
                font-size: 4rem;
            }

            .hero-title p {
                font-size: 0.62rem;

            }

            .profile-container {
                width: 145px;

                bottom: -72px;
            }

            }

                grid-template-columns: 1fr;

                padding: 0 6%;
            }

            .image-tile {
                height: 230px;
            }

            .image-banner {
                min-height: 300px;
            }
